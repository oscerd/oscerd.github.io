# Dependencies
markdown:         kramdown
highlighter:      rouge

plugins:
  - jekyll-paginate
  - jekyll-seo-tag

# Setup
title:            Software Blog 
tagline:          'Open source'
description:      'Thoughts about programming, open source and more'
url:              https://oscerd.github.io
# Site lives at the domain root, so baseurl must be empty. Anything else and
# `absolute_url` (used by jekyll-seo-tag for canonical/og:url) doubles the host.
baseurl:          ''

author:
  name:           'Andrea Cosentino'
  url:            https://twitter.com/oscerd2

paginate:         5

github:
  repo:           https://github.com/oscerd/oscerd.github.io
